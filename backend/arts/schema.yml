          description: Select the student admission-year batches allowed to participate
            (e.g. 2023-26, 2024-27). Leave empty to allow ALL current students.
        event_image:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        venue:
          type: string
          maxLength: 200
        max_participants:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Maximum number of participants allowed
        rules:
          type: string
        is_active:
          type: boolean
          description: Only active programs are visible to students.
        is_graduate_restricted:
          type: boolean
          description: If True, alumni / graduated students cannot participate.
        last_date:
          type: string
