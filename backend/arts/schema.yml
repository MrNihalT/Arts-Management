components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
      required:
      - end_date
      - id
      - name
      - start_date
      - year
    AdminCreateUser:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          nullable: true
          maxLength: 15
        department:
          type: integer
          nullable: true
        admission_year:
          type: integer
          nullable: true
        expected_graduation_year:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        is_alumni:
          type: boolean
        is_dropout:
          type: boolean
      required:
      - password
      - username
    AdminUpdateUser:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 15
        department_id:
          type: integer
          nullable: true
        admission_year_id:
          type: integer
          nullable: true
        expected_graduation_year:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        is_alumni:
          type: boolean
        is_dropout:
          type: boolean
      required:
      - username
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 250
        message:
          type: string
        link:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - title
    ArtsFest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: The year the Arts Fest is conducted in.
        max_programs_per_student:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Max items a student can participate in
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          nullable: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
      - year
    ArtsProgram:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        arts_fest:
          type: integer
